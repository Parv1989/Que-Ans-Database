<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Help Chat</title>
<link rel="stylesheet" href="chatbot.css" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-title">Study Buddy</div>
        <div class="chat-header-sub">Poocho, jo bhi book ke baare me jaanna hai</div>
      </div>
      <button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle voice">
        <span id="muteIcon">&#128266;</span>
      </button>
    </header>

    <!-- Animated robot mascot -->
    <div class="robot-stage">
      <svg id="robot" class="robot" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- antennae -->
        <line x1="70" y1="34" x2="70" y2="18" stroke="#8a83c9" stroke-width="4" stroke-linecap="round"/>
        <line x1="130" y1="34" x2="130" y2="18" stroke="#8a83c9" stroke-width="4" stroke-linecap="round"/>
        <circle class="antenna-light" cx="70" cy="14" r="5.5"/>
        <circle class="antenna-light" cx="130" cy="14" r="5.5"/>
        <!-- head: rounded square, classic robot emoji style -->
        <rect x="34" y="34" width="132" height="106" rx="26" fill="#8a83c9"/>
        <rect x="46" y="46" width="108" height="82" rx="18" fill="#c9c4ea"/>
        <!-- eyes: flat glowing circles -->
        <circle class="eye" cx="80" cy="82" r="11"/>
        <circle class="eye" cx="120" cy="82" r="11"/>
        <!-- mouth: 5-bar equalizer, looks like talking/sound when animated -->
        <g id="mouth" class="mouth-group">
          <rect class="mouth-bar" x="76" y="106" width="6" height="6" rx="3"/>
          <rect class="mouth-bar" x="87" y="103" width="6" height="9" rx="3"/>
          <rect class="mouth-bar" x="98" y="100" width="6" height="12" rx="3"/>
          <rect class="mouth-bar" x="109" y="103" width="6" height="9" rx="3"/>
          <rect class="mouth-bar" x="120" y="106" width="6" height="6" rx="3"/>
        </g>
        <!-- body -->
        <rect x="62" y="140" width="76" height="34" rx="14" fill="#8a83c9"/>
      </svg>
    </div>

    <div id="messages" class="chat-messages">
      <div class="msg bot">
        <p>Namaste! Aap is book ke baare me koi bhi sawaal pooch sakte hain — main turant answer dene ki koshish karunga.</p>
      </div>
    </div>

    <form id="chatForm" class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Apna sawaal likhein…" autocomplete="off" required />
      <button type="submit" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <script src="chatbot.js"></script>
</body>
</html>
