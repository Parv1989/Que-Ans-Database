<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Help Chat</title>
<link rel="stylesheet" href="chatbot.css" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <span class="chat-header-mark">&#128214;</span>
      <div>
        <div class="chat-header-title">Book Help</div>
        <div class="chat-header-sub">Ask anything about the book</div>
      </div>
    </header>

    <div id="messages" class="chat-messages">
      <div class="msg bot">
        <p>Namaste! Aap is book ke baare me koi bhi sawaal pooch sakte hain — main turant answer dene ki koshish karunga.</p>
      </div>
    </div>

    <form id="chatForm" class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Apna sawaal likhein…" autocomplete="off" required />
      <button type="submit" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <script src="chatbot.js"></script>
</body>
</html>
