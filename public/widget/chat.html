<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Help Chat</title>
<link rel="stylesheet" href="chatbot.css?v=2" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-title">Study Buddy</div>
        <div class="chat-header-sub">Poocho, jo bhi book ke baare me jaanna hai</div>
      </div>
      <button id="muteBtn" class="mute-btn" type="button" aria-label="Toggle voice">
        <span id="muteIcon">&#128266;</span>
      </button>
    </header>

    <!-- Friendly animated robot mascot -->
    <div class="robot-stage">
      <svg id="robot" class="robot" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="robot-antenna" d="M100 27V14" />
        <circle class="antenna-light" cx="100" cy="10" r="6" />
        <rect class="robot-ear" x="25" y="69" width="14" height="35" rx="7" />
        <rect class="robot-ear" x="161" y="69" width="14" height="35" rx="7" />
        <rect class="robot-head" x="34" y="30" width="132" height="106" rx="34" />
        <rect class="robot-face" x="45" y="42" width="110" height="83" rx="25" />
        <circle class="eye" cx="78" cy="76" r="10" />
        <circle class="eye" cx="122" cy="76" r="10" />
        <circle class="eye-shine" cx="75" cy="72" r="3" />
        <circle class="eye-shine" cx="119" cy="72" r="3" />
        <ellipse id="mouth" class="mouth" cx="100" cy="104" rx="16" ry="5" />
        <rect class="robot-body" x="60" y="136" width="80" height="38" rx="17" />
        <rect class="chest-panel" x="83" y="146" width="34" height="17" rx="8" />
        <circle class="chest-light" cx="100" cy="154.5" r="4" />
      </svg>
    </div>

    <div id="messages" class="chat-messages">
      <div class="msg bot">
        <p>Namaste! Aap is book ke baare me koi bhi sawaal pooch sakte hain — main turant answer dene ki koshish karunga.</p>
      </div>
    </div>

    <form id="chatForm" class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Apna sawaal likhein…" autocomplete="off" required />
      <button type="submit" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <script src="chatbot.js?v=2"></script>
</body>
</html>
